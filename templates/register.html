<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MDSS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #002060 0%, #0a3080 60%, #028090 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .register-container {
            background: white;
            border-radius: 16px;
            padding: 48px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            justify-content: center;
        }
        .logo-icon {
            width: 44px;
            height: 44px;
            background: #002060;
            color: #F5A623;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
        }
        .logo-text h1 {
            font-size: 20px;
            font-weight: 700;
            color: #002060;
            line-height: 1.1;
        }
        .logo-text p {
            font-size: 11px;
            color: #94a3b8;
        }
        .register-title {
            font-size: 24px;
            font-weight: 700;
            color: #002060;
            margin-bottom: 6px;
            text-align: center;
        }
        .register-sub {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 32px;
            text-align: center;
        }
        .field {
            margin-bottom: 20px;
        }
        .field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            margin-bottom: 6px;
        }
        .field input,
        .field select {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: #1e293b;
            outline: none;
            transition: border-color 0.2s;
            background: white;
        }
        .field input:focus,
        .field select:focus {
            border-color: #028090;
            box-shadow: 0 0 0 3px rgba(2,128,144,0.1);
        }
        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .role-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 6px;
        }
        .role-option {
            position: relative;
        }
        .role-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }
        .role-option label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 10px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            margin-bottom: 0;
        }
        .role-option label:hover {
            border-color: #028090;
            background: rgba(2,128,144,0.05);
        }
        .role-option input[type="radio"]:checked + label {
            border-color: #002060;
            background: rgba(0,32,96,0.05);
        }
        .role-option label .role-icon {
            font-size: 24px;
            margin-bottom: 6px;
        }
        .role-option label .role-name {
            font-size: 12px;
            font-weight: 600;
            color: #002060;
            margin-bottom: 2px;
        }
        .role-option label .role-desc {
            font-size: 10px;
            color: #94a3b8;
            font-weight: 400;
        }
        .btn-register {
            width: 100%;
            background: linear-gradient(135deg, #002060 0%, #028090 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn-register:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0,32,96,0.3);
        }
        .error-box {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #C84B31;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .login-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #94a3b8;
        }
        .login-link a {
            color: #028090;
            font-weight: 600;
            text-decoration: none;
        }
        .login-link a:hover { text-decoration: underline; }
        .section-label {
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            margin-bottom: 6px;
            display: block;
        }
        footer {
            text-align: center;
            margin-top: 24px;
            font-size: 11px;
            color: rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>

    <div>
        <div class="register-container">

            <!-- Logo -->
            <div class="logo">
                <div class="logo-icon">+</div>
                <div class="logo-text">
                    <h1>MDSS</h1>
                    <p>Medical Decision Support System</p>
                </div>
            </div>

            <h2 class="register-title">Create Account</h2>
            <p class="register-sub">Join the MDSS platform to access breast cancer detection tools</p>

            <!-- Error message -->
            {% if error %}
            <div class="error-box">⚠️ {{ error }}</div>
            {% endif %}

            <!-- Register Form -->
            <form method="POST" action="/register">

                <div class="field">
                    <label>Full Name</label>
                    <input type="text" name="name" placeholder="Enter your full name" required>
                </div>

                <div class="field">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="Enter your email address" required>
                </div>

                <div class="field">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Create a strong password" required minlength="6">
                </div>

                <!-- Role Selection -->
                <div class="field">
                    <span class="section-label">I am a:</span>
                    <div class="role-grid">

                        <div class="role-option">
                            <input type="radio" name="role" id="role_radiologist" value="radiologist">
                            <label for="role_radiologist">
                                <span class="role-icon">👨‍⚕️</span>
                                <span class="role-name">Radiologist</span>
                                <span class="role-desc">Full clinical access</span>
                            </label>
                        </div>

                        <div class="role-option">
                            <input type="radio" name="role" id="role_doctor" value="doctor">
                            <label for="role_doctor">
                                <span class="role-icon">🏥</span>
                                <span class="role-name">Doctor / GP</span>
                                <span class="role-desc">Run patient analyses</span>
                            </label>
                        </div>

                        <div class="role-option">
                            <input type="radio" name="role" id="role_oncologist" value="oncologist">
                            <label for="role_oncologist">
                                <span class="role-icon">🔬</span>
                                <span class="role-name">Oncologist</span>
                                <span class="role-desc">Monitor referred cases</span>
                            </label>
                        </div>

                        <div class="role-option">
                            <input type="radio" name="role" id="role_patient" value="patient" checked>
                            <label for="role_patient">
                                <span class="role-icon">👤</span>
                                <span class="role-name">Patient</span>
                                <span class="role-desc">View my own results</span>
                            </label>
                        </div>

                    </div>
                </div>

                <button type="submit" class="btn-register">Create Account →</button>

            </form>

            <div class="login-link">
                Already have an account?
                <a href="/login">Sign in here</a>
            </div>

        </div>

        <footer>
            MDSS · Subgroup 3 · AAUA Faculty of Computing · Dr. Ogbeide
        </footer>
    </div>

</body>
</html>
